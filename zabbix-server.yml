- name: Install and configure Zabbix server
  hosts: zabbix
  become: yes
  vars_files:
    - ansible_vault.yml
  
  tasks:
    - name: Install required packages
      apt:
        name:
          - apache2
          - mysql-server
          - php
          - php-mysql
          - php-mbstring
          - php-gd
          - php-xml
          - php-bcmath
          - php-ldap
          - php-xmlrpc
          - zip
          - unzip
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Download Zabbix repository package
      get_url:
        url: https://repo.zabbix.com/zabbix/6.4/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.4-1+ubuntu22.04_all.deb
        dest: /tmp/zabbix-release.deb

    - name: Install Zabbix repository
      apt:
        deb: /tmp/zabbix-release.deb
        state: present

    - name: Install Zabbix server, frontend, and agent
      apt:
        name:
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-agent
          - zabbix-sql-scripts
        state: present
        update_cache: yes

    - name: Start and enable MySQL
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Set MySQL root password
      mysql_user:
        name: root
        password: "{{ mysql_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        state: present

    - name: Create .my.cnf file with root credentials
      template:
        src: my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'

    - name: Create Zabbix database
      mysql_db:
        name: zabbix
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
        encoding: utf8
        collation: utf8_bin

    - name: Create Zabbix database user
      mysql_user:
          name: zabbix
          host: localhost  
          password: "{{ zabbix_db_password }}"
          priv: 'zabbix.*:ALL'
          state: present
          login_user: root
          login_password: "{{ mysql_root_password }}"
          login_host: localhost

    - name: Configure MySQL for Zabbix
      mysql_variables:
        variable: log_bin_trust_function_creators
        value: 1
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Import Zabbix database schema
      shell: gunzip -c /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql -uzabbix -p{{ zabbix_db_password }} zabbix
      args:
        creates: /var/lib/mysql/zabbix/dbversion

    - name: Configure Zabbix server
      template:
        src: zabbix_server.conf.j2
        dest: /etc/zabbix/zabbix_server.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart zabbix server

    - name: Configure PHP for Zabbix frontend
      template:
        src: zabbix.conf.j2
        dest: /etc/zabbix/apache.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart apache

    - name: Start and enable Zabbix server and agent
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - zabbix-server
        - zabbix-agent
        - apache2

  handlers:
    - name: restart zabbix server
      service:
        name: zabbix-server
        state: restarted

    - name: restart apache
      service:
        name: apache2
        state: restarted
