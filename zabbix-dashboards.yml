- name: Настройка дашбордов и шаблонов Zabbix
  hosts: localhost
  gather_facts: no
  vars_files:
    - ansible_vault.yml
  vars:
    zabbix_url: "http://{{ zabbix_ip | default('127.0.0.1') }}/api_jsonrpc.php"
    
    # ИСПРАВЛЕНИЕ 1: Приводим имена групп к единообразию.
    # Предполагаем, что в inventory группа называется [zabbix].
    dashboard_hosts_web: "{{ groups['webservers'] | default([]) }}"
    dashboard_hosts_infra: "{{ groups['bastion'] | default([]) + groups['zabbix'] | default([]) + groups['elastic'] | default([]) }}"
    
    common_graphs:
      - { name: "CPU utilization", label: "CPU" }
      - { name: "Memory utilization", label: "RAM" }
      - { name: "Disk space usage %", label: "Disk Space" }
      - { name: "Network traffic", label: "Network" }

  tasks:
    # Проверка соединения с API (опционально, но полезно для отладки)
    - name: Проверка доступности Zabbix API
      uri:
        url: "{{ zabbix_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "apiinfo.version"
          params: []
          id: 1
          auth: null
        status_code: 200
      register: zabbix_api_check
      failed_when: zabbix_api_check.json is not defined

    # ИСПРАВЛЕНИЕ 2: Генерация виджетов через set_fact.
    # Используем Jinja2 для формирования списка словарей.
    
    - name: Подготовить виджеты для Web Servers
      set_fact:
        web_widgets_final: >
          {% set result = [] %}
          {% for host_item in dashboard_hosts_web %}
            {% for graph_item in common_graphs %}
              {% set _ = result.append({
                'type': 'graph',
                'width': 12,
                'height': 5,
                'x': (loop.index0 * 12) % 24,
                'y': (loop.index0 // 2) * 5,
                'name': host_item + ' - ' + graph_item.label,
                'resource_type': 'graph',
                'graph': {
                  'resource': {
                    'name': graph_item.name,
                    'host': host_item
                  }
                }
              }) %}
            {% endfor %}
          {% endfor %}
          {{ result }}

    - name: Подготовить виджеты для Infra
      set_fact:
        infra_widgets_final: >
          {% set result = [] %}
          {% for host_item in dashboard_hosts_infra %}
            {% for graph_item in common_graphs %}
              {% set _ = result.append({
                'type': 'graph',
                'width': 12,
                'height': 5,
                'x': (loop.index0 * 12) % 24,
                'y': (loop.index0 // 2) * 5,
                'name': host_item + ' - ' + graph_item.label,
                'resource_type': 'graph',
                'graph': {
                  'resource': {
                    'name': graph_item.name,
                    'host': host_item
                  }
                }
              }) %}
            {% endfor %}
          {% endfor %}
          {{ result }}

    # Отладка: можно раскомментировать для проверки содержимого списков перед запуском
    # - name: Отладка web_widgets_final
    #   debug:
    #     var: web_widgets_final
    # - name: Отладка infra_widgets_final
    #   debug:
    #     var: infra_widgets_final

    - name: Создать/Обновить дашборд "System Health Overview"
      community.zabbix.zabbix_dashboard:
        server_url: "{{ zabbix_url }}"
        http_login_user: "{{ zabbix_api_user }}"
        http_login_password: "{{ zabbix_api_password }}"
        state: present
        dashboard_name: "System Health Overview"
        pages:
          - name: "Overview"
            widgets:
              - type: problems
                width: 12
                height: 5
                x: 0
                y: 0
              - type: hostavail
                width: 12
                height: 5
                x: 12
                y: 0
              - type: systeminfo
                width: 12
                height: 4
                x: 0
                y: 5
              - type: tophosts
                width: 12
                height: 4
                x: 12
                y: 5
                name: "Top hosts by CPU"
                fields:
                  - type: item
                    name: "CPU utilization"
                    color: "FF0000"
              - type: problems
                width: 24
                height: 5
                x: 0
                y: 9
                name: "Recent Problems"

          - name: "Web servers"
            widgets: "{{ web_widgets_final }}"

          - name: "Infra"
            widgets: "{{ infra_widgets_final }}"

