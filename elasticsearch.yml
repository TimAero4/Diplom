- name: Install and configure Elasticsearch
  hosts: elastic
  become: yes

  tasks:
    - name: Install Java
      apt:
        name:
          - openjdk-11-jdk
        state: present
        update_cache: yes

    # --- ИСПРАВЛЕННАЯ ЧАСТЬ ---
    # Мы объединяем добавление ключа и репозитория в одну задачу
    - name: Add Elasticsearch repository (with key)
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
        state: present
        filename: elasticsearch-8.x
        update_cache: yes

    # Скачиваем ключ отдельно и сохраняем в файл keyring
    - name: Add Elasticsearch apt key
      ansible.builtin.get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /usr/share/keyrings/elasticsearch-keyring.gpg
        mode: '0644'
        force: true
    # -------------------------

    - name: Install Elasticsearch
      apt:
        name: elasticsearch
        state: present

    - name: Configure Elasticsearch
      template:
        src: elasticsearch.yml.j2
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: root
        mode: '0644'
      notify: restart elasticsearch

    - name: Start and enable Elasticsearch
      service:
        name: elasticsearch
        state: started
        enabled: yes

  handlers:
    - name: restart elasticsearch
      service:
        name: elasticsearch
        state: restarted
