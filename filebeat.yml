- name: Install and configure Filebeat
  hosts: webservers
  become: yes
  vars:
    # Мы не используем внешние URL, полагаемся на apt cache
    elasticsearch_host: "{{ hostvars[groups['elastic'][0]]['ansible_host'] }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Filebeat from system repository
      apt:
        name: filebeat
        state: present
      # Эта команда попытается найти filebeat в /etc/apt/sources.list (обычно репозитории Ubuntu)

    - name: Configure Filebeat
      template:
        src: filebeat.yml.j2
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: '0600'
      notify: restart filebeat

    - name: Enable and configure Filebeat modules
      command: filebeat modules enable nginx
      notify: restart filebeat

    - name: Start and enable Filebeat
      service:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: restart filebeat
      service:
        name: filebeat
        state: restarted
