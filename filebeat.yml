- name: Install and configure Filebeat
  hosts: webservers
  become: yes
  vars:
    # Динамически получаем IP первого хоста Elasticsearch
    elasticsearch_host: "{{ hostvars[groups['elastic'][0]]['ansible_default_ipv4']['address'] }}"
    # Явно указываем версию Filebeat (должна совпадать с версией ES или быть совместимой)
    filebeat_version: "8.11.1"

  tasks:
    - name: Install dependencies (curl)
      apt:
        name:
          - curl
        state: present
        update_cache: yes

    # Скачиваем .deb пакет напрямую, подменяя User-Agent
    - name: Download Filebeat .deb package
      ansible.builtin.shell: |
        curl -L -O https://artifacts.elastic.co/downloads/beats/filebeat/filebeat-{{ filebeat_version }}-amd64.deb \
          -H "User-Agent: Mozilla/5.0"
      args:
        chdir: /tmp
        creates: "/tmp/filebeat-{{ filebeat_version }}-amd64.deb"

    # Устанавливаем скачанный пакет
    - name: Install Filebeat from deb
      apt:
        deb: "/tmp/filebeat-{{ filebeat_version }}-amd64.deb"
        state: present

    - name: Deploy Filebeat configuration
      template:
        src: filebeat.yml.j2
        dest: /etc/filebeat/filebeat.yml
        owner: root
        group: root
        mode: '0600'
      notify: restart filebeat

    - name: Enable Nginx module for Filebeat
      command: filebeat modules enable nginx
      changed_when: false
      notify: restart filebeat

    - name: Start and enable Filebeat service
      service:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: restart filebeat
      service:
        name: filebeat
        state: restarted
